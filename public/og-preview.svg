<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Outer Glow Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
  
  <!-- Header Badge -->
  <rect x="80" y="80" width="320" height="44" rx="22" fill="#1e2433" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="108" fill="#4ade80" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">● LIVE GLOBAL PLATFORM</text>
  
  <!-- Main Title -->
  <text x="80" y="200" fill="url(#gold)" font-size="64" font-family="system-ui, sans-serif" font-weight="900" letter-spacing="-1">K-POP TOUR PULSE</text>
  
  <!-- Subtitle -->
  <text x="80" y="270" fill="#f8fafc" font-size="34" font-family="system-ui, sans-serif" font-weight="800">5대 메가 아티스트 글로벌 월드투어 &amp; 실시간 티켓 알림</text>
  <text x="80" y="320" fill="#94a3b8" font-size="22" font-family="system-ui, sans-serif">지드래곤 · BTS · BLACKPINK · SEVENTEEN · Stray Kids</text>
  
  <!-- 3 Key Value Cards -->
  <g transform="translate(80, 380)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="320" height="150" rx="16" fill="#11151f" stroke="#283042" stroke-width="1.5"/>
    <text x="24" y="50" fill="#ffd700" font-size="28">🗺️</text>
    <text x="24" y="90" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">18개 도시 인터랙티브 지도</text>
    <text x="24" y="120" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">실시간 스타디움 순회 동선</text>
    
    <!-- Card 2 -->
    <rect x="360" y="0" width="320" height="150" rx="16" fill="#11151f" stroke="#283042" stroke-width="1.5"/>
    <text x="384" y="50" fill="#ffd700" font-size="28">🔔</text>
    <text x="384" y="90" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">티켓 오픈 실시간 이메일</text>
    <text x="384" y="120" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">예매 시작 1분 전 알림</text>
    
    <!-- Card 3 -->
    <rect x="720" y="0" width="320" height="150" rx="16" fill="#11151f" stroke="#283042" stroke-width="1.5"/>
    <text x="744" y="50" fill="#ffd700" font-size="28">🗣️</text>
    <text x="744" y="90" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">K-POP 현장 한국어 팩</text>
    <text x="744" y="120" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">Google Cloud AI 음성 지원</text>
  </g>
</svg>